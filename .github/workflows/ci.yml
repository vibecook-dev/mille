name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release Please opens its PR with GITHUB_TOKEN, and GitHub suppresses
  # workflow runs for events raised by that token — the same rule this repo
  # already works around for tags in `release-please.yml`. The consequence is
  # that the one PR which rewrites every version in the tree was the one PR
  # nothing tested, so it merged red and broke `main` (0.3.1). `release-please.yml`
  # dispatches this workflow onto the release branch explicitly; that needs a
  # `workflow_dispatch` trigger to land on.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # ------------------------------------------------------------------
  # Rust-only checks (fmt, clippy, tests on host).
  # ------------------------------------------------------------------
  test-rust:
    name: Rust lints & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Exclude mille-binding: cdylib links against Node's N-API and cannot
      # produce a standalone test binary on bare Ubuntu.
      - name: cargo test
        run: cargo test --workspace --exclude mille-binding

  # ------------------------------------------------------------------
  # JS / TS checks on host only.
  # ------------------------------------------------------------------
  test-js:
    name: JS typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `.gitignore` deliberately un-ignores packages/mille-*/**/*.node, because
      # npm falls back to .gitignore when packing and the release job's freshly
      # copied binaries have to reach the tarballs. The side effect is that a
      # stray local build sitting in one of those directories is an ordinary
      # untracked file that `git add -A` will happily commit — ~20 MB of it, and
      # permanently, since pushed history can't be un-shipped.
      #
      # Nothing else would notice: the release still works, because the workflow
      # overwrites these paths with fresh artifacts before publishing. The only
      # symptom is a quietly growing repository.
      - name: No native binaries may be committed
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'packages/mille-*/*.node')
          if [ -n "$tracked" ]; then
            echo "::error::Native binaries are checked in. They are build output — untrack with 'git rm --cached'."
            echo "$tracked"
            exit 1
          fi
          echo "No .node binaries tracked."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json packageManager (pnpm@10.x)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Sits with the other repo-integrity checks rather than in the test
      # matrix: it needs no install and no build, it is platform-independent,
      # and the failure it catches deserves to surface in seconds instead of
      # after a release-profile compile. 0.3.1 shipped with a stale version
      # literal and turned `main` red — see the script header.
      - name: Release version consistency
        run: pnpm run release:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: js-napi

      # Integration tests load the N-API binary; dist/ is gitignored so we
      # also emit TypeScript before typecheck.
      #
      # `:probe` is `:debug` plus the `panic-probe` feature, which adds the
      # deliberately-panicking entry points `panic-boundary.test.mjs` calls to
      # prove a native panic reaches JS instead of SIGABRT-ing the host. The
      # feature is off by default, so published artifacts never carry them.
      - name: Build native + TS packages
        run: |
          pnpm --filter @vibecook/mille run build:napi:probe
          pnpm --filter @vibecook/mille run build:ts
          pnpm --filter @vibecook/mille-ui run build
          pnpm --filter @vibecook/mille-truffle run build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: FileTree structural invariant bench
        # The bench's 120 ms default is the reference-hardware budget: an
        # M-series Mac measures p95 109 ms at the default 30 samples. A shared
        # CI runner measured 204 ms and 289 ms for the same commit, so the
        # default gate here was reporting the runner, not a regression.
        #
        # 30 samples makes p95 the second-worst sample, which one scheduling
        # hiccup decides, so this takes 60. That stabilises the number without
        # lowering it here: four green runs at 60 samples measured p95 270.7,
        # 296.5, 307.8 and 312.1 ms — a ±7% spread around ~297 ms. (It does
        # lower it locally, 109 ms to ~90 ms; the runner is simply slower.)
        #
        # 400 ms is therefore 1.28x the worst of those four, which is enough
        # headroom for runner noise while still catching a ~30% regression.
        #
        # Gating on a ratio to another bench row was tried and rejected: the
        # reference rows are noisier than the number being gated. follow ÷
        # "reveal path to row 400k" is 1.38 locally but 2.05-2.68 across these
        # same CI runs, so normalising would import that spread rather than
        # cancel the hardware out. The absolute p95 is the steadier signal.
        #
        # Tighten when there are more samples to fit; revisit when Phase 1
        # ratifies reference hardware.
        env:
          MILLE_FOLLOW_ACTIVE_SAMPLES: 60
          MILLE_FOLLOW_ACTIVE_P95_BUDGET_MS: 400
        run: pnpm bench:ui

      - name: Repeat live watcher regressions
        shell: bash
        run: |
          for run in $(seq 1 20); do
            echo "watcher repetition ${run}/20"
            node --test packages/mille/test/watcher-host.test.mjs packages/mille/test/watcher-live.test.mjs
          done

      - name: Watcher correctness and latency soak
        run: node packages/mille/bench/watch-soak.mjs --report watch-soak-report.json

      - name: Upload watcher soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-soak-${{ github.sha }}
          path: watch-soak-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Electron renderer quality gate
        run: >-
          xvfb-run --auto-servernum node scripts/watch-bench.mjs
          --operations 120 --seed-files 2000 --exit
          --report electron-watch-bench-report.json

      - name: Upload Electron renderer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-watch-bench-${{ github.sha }}
          path: electron-watch-bench-report.json
          if-no-files-found: warn
          retention-days: 14

      # Phase 6.3 — real axe-core against a real renderer. The unit suite
      # hand-rolls the ARIA tree pattern because happy-dom has no layout, so
      # contrast and visibility rules cannot mean anything there. Audits both
      # themes: the light palette shipped a failing dim colour that a
      # dark-only run could not see.
      - name: Accessibility audit (axe-core, Electron)
        run: >-
          xvfb-run --auto-servernum node scripts/axe-check.mjs
          --report axe-report.json

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-${{ github.sha }}
          path: axe-report.json
          if-no-files-found: warn
          retention-days: 14

      # v0.2 B8 — mille-ui bundle size assertion. Fails CI on regression.
      # Budgets live in `packages/mille-ui/package.json` under
      # `size-limit`; see SPEC §12 for targets.
      - name: mille-ui size check
        run: pnpm --filter @vibecook/mille-ui run size

  # ------------------------------------------------------------------
  # The same suite against the profile that actually ships.
  #
  # `test-js` above builds `build:napi:probe` — a *debug* binary. That is the
  # cheap, fast signal, but it is not what users install, and the difference
  # has hidden real defects:
  #
  #   - `[profile.release]` carried `panic = "abort"`, so a native panic
  #     SIGABRT'd the host process. Debug unwinds, so the debug suite could
  #     never see it. Worse, tokio catches panics in its own task machinery,
  #     which meant the *async* entry points recovered cleanly in debug and
  #     died in release — the suite proved a property the artifact lacked.
  #
  # Release also changes optimisation and therefore timing, which is exactly
  # what the watcher and ack/resync paths are sensitive to. So this job runs
  # the full suite, plus extra watcher repetitions, against a real release
  # build. It is slower (`lto = "fat"`, `codegen-units = 1`), so it runs as
  # its own job rather than lengthening the critical path.
  #
  # Deliberately NOT lto="thin" or a bespoke fast profile: a profile that is
  # merely close to the shipped one reintroduces the exact class of gap this
  # job exists to close.
  #
  # Benches and the axe/Electron gates stay debug-only — their budgets are
  # calibrated against the debug binary, and re-basing them is separate work.
  test-release-profile:
    name: Release-profile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-profile

      # `:probe:release` is the shipped profile plus the panic-probe feature,
      # so the behavioural panic assertions run here rather than skipping.
      # The feature is off by default and never enters a published artifact.
      - name: Build native (release) + TS packages
        run: |
          pnpm --filter @vibecook/mille run build:napi:probe:release
          pnpm --filter @vibecook/mille run build:ts
          pnpm --filter @vibecook/mille-ui run build
          pnpm --filter @vibecook/mille-truffle run build

      # Without this the job could silently degrade into a second debug run —
      # a green tick proving nothing, which is the failure mode this whole job
      # exists to prevent.
      - name: Confirm the binary under test is a release build
        run: node scripts/assert-release-binary.mjs

      - name: Test
        run: pnpm -r --if-present test

      # Optimised builds reorder and inline enough to shift these timings;
      # the debug job repeats them 20x for the same reason.
      - name: Repeat live watcher regressions
        shell: bash
        run: |
          for run in $(seq 1 10); do
            echo "watcher repetition ${run}/10 (release)"
            node --test packages/mille/test/watcher-host.test.mjs packages/mille/test/watcher-live.test.mjs
          done

      # The resync ack race reproduced ~1 in 20 and only under real timing.
      #
      # Output is captured rather than discarded. Twenty repetitions of full TAP
      # would bury the log, but `>/dev/null` traded that for a failure message
      # naming only the repetition number — which is the worst case for a flake,
      # since the one run that reproduces it is also the one you cannot inspect.
      # Quiet while passing, complete when it breaks.
      - name: Repeat resync synchronization regressions
        shell: bash
        run: |
          log=$(mktemp)
          for run in $(seq 1 20); do
            if ! node --test packages/mille/test/resync.test.mjs >"$log" 2>&1; then
              echo "::error::resync regression on repetition ${run}"
              cat "$log"
              exit 1
            fi
          done
          echo "20 clean resync repetitions"

  # ------------------------------------------------------------------
  # The suite on Windows.
  #
  # Every job above runs on ubuntu-latest, and Windows appeared only in the
  # `build` matrix below — which compiles a .node and uploads it without ever
  # loading it. The only Windows execution anywhere was `smoke-published.yml`,
  # which runs after a release and does one walk. So nothing exercised the
  # watcher, the host/renderer port protocol, or the mutation paths on Windows
  # before shipping, and three classes of defect lived there undetected:
  #
  #   - `ReadDirectoryChangesW` reports a content write as `Modify(Any)`,
  #     which the classifier sent into the rename pairer; every save waited out
  #     the pair window and then surfaced to JS as a WRENAMEDEGRADED warning
  #     instead of a `changed` event.
  #   - The RPCs documented as synchronization points flushed with a single
  #     `setImmediate` rather than waiting for the delta to be acknowledged.
  #     That guess held on an idle Linux runner and lost on Windows, so a
  #     second attached client's mirror was a version behind when the
  #     initiator's promise resolved.
  #   - Several tests asserted POSIX path and errno shapes, so they could only
  #     ever pass on Unix.
  #
  # `timeout-minutes` is deliberate: the failure mode that hid the port bug was
  # a test process that finished its tests and then never exited, which without
  # a timeout burns the default 6h budget instead of reporting.
  test-windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-tests

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Worth repeating per-platform rather than trusting the Linux run:
      # `cfg`-gated code changes what is reachable, so a `#[cfg(unix)]` block
      # can leave imports unused on Windows only — three such warnings existed
      # here, and `-D warnings` makes them build failures.
      #
      # `cargo fmt --check` also only passes because `.gitattributes` pins the
      # checkout to LF: `rustfmt.toml` sets `newline_style = "Unix"`, so a CRLF
      # working tree fails every file.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Same exclusion as the Linux job: mille-binding is a cdylib against
      # Node's N-API and cannot produce a standalone test binary.
      - name: cargo test
        run: cargo test --workspace --exclude mille-binding

      - name: Build native + TS packages
        run: |
          pnpm --filter @vibecook/mille run build:napi:probe
          pnpm --filter @vibecook/mille run build:ts
          pnpm --filter @vibecook/mille-ui run build
          pnpm --filter @vibecook/mille-truffle run build

      # A generated file that is also committed. It used to be rebuilt with
      # mixed line endings here and left the tree dirty; `.gitattributes` plus
      # `scripts/build-tokens.mjs` pin it, and this proves it stays pinned.
      - name: Generated tokens.css is byte-identical
        shell: bash
        run: git diff --exit-code -- packages/mille-ui/tokens.css

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      # The Windows watcher path is the one this job exists for, and its
      # failures are timing-dependent. The Linux job repeats these for the
      # same reason.
      - name: Repeat live watcher regressions
        shell: bash
        run: |
          for run in $(seq 1 10); do
            echo "watcher repetition ${run}/10"
            node --test packages/mille/test/watcher-host.test.mjs packages/mille/test/watcher-live.test.mjs
          done

      # Multi-client fan-out ordering — the class of bug that only reproduced
      # off-Linux. Each of these asserts that every attached mirror is current
      # before the initiating client's promise resolves.
      #
      # Captured, not discarded — see the resync step above. This one already
      # cost a diagnosis: repetition 9 failed on b1631df and the log recorded
      # nothing but the repetition number.
      - name: Repeat port synchronization regressions
        shell: bash
        run: |
          log=$(mktemp)
          for run in $(seq 1 10); do
            if ! node --test \
              packages/mille/test/resync.test.mjs \
              packages/mille/test/settings-live.test.mjs \
              packages/mille/test/multi-root-order.test.mjs \
              packages/mille/test/workspace-roots-live.test.mjs \
              >"$log" 2>&1; then
              echo "::error::port synchronization regression on repetition ${run}"
              cat "$log"
              exit 1
            fi
          done
          echo "10 clean port synchronization repetitions"

  # ------------------------------------------------------------------
  # Native build matrix — 8 triples per SPEC §6.2.
  # Each job produces a .node artifact for the corresponding platform.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
            build: pnpm build:napi --target aarch64-apple-darwin

          # Cross-compile on arm64 macos-14 — macos-13 Intel is retired/scarce.
          - host: macos-14
            target: x86_64-apple-darwin
            build: pnpm build:napi --target x86_64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build:napi --target x86_64-pc-windows-msvc

          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build:napi --target aarch64-pc-windows-msvc

          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: pnpm build:napi --target x86_64-unknown-linux-gnu --use-napi-cross

          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: pnpm build:napi --target aarch64-unknown-linux-gnu --use-napi-cross

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target x86_64-unknown-linux-musl

          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target aarch64-unknown-linux-musl --use-napi-cross

    steps:
      - uses: actions/checkout@v7

      # Host tooling only for non-docker targets (see release.yml).
      - name: Setup pnpm
        if: ${{ !matrix.settings.docker }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        if: ${{ !matrix.settings.docker }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: pnpm install --frozen-lockfile=false

      - name: Build (host)
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: ${{ matrix.settings.build }}

      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: -v ${{ github.workspace }}:/build -w /build -e CI=true
          shell: bash
          run: |
            set -euo pipefail
            export CI=true
            # Alpine images still ship Node 18; @napi-rs/cli needs styleText (Node 20+).
            major=$(node -p "process.versions.node.split('.')[0]")
            if [ "$major" -lt 20 ]; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache curl xz
                arch=$(uname -m)
                case "$arch" in
                  x86_64) node_arch=x64 ;;
                  aarch64) node_arch=arm64 ;;
                  *) echo "unsupported arch: $arch"; exit 1 ;;
                esac
                curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v20.18.1/node-v20.18.1-linux-${node_arch}-musl.tar.gz" \
                  | tar -xz -C /usr/local --strip-components=1
              else
                npm install -g n --force && n 20
                hash -r
              fi
            fi
            node -v
            npm install -g pnpm@10.33.0 --force
            pnpm config set confirmModulesPurge false
            pnpm install --frozen-lockfile=false
            ${{ matrix.settings.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            packages/**/*.node
            artifacts/**/*.node
          if-no-files-found: error
          retention-days: 7
