name: Release

# Publish @vibecook/mille monorepo packages via npm Trusted Publishing (OIDC).
# No long-lived NPM_TOKEN required after each package has a Trusted Publisher
# configured on npmjs.com pointing at this workflow file (release.yml).
#
# First-time packages: publish once with a human/npm login (see scripts below
# or an initial Automation token), then add Trusted Publisher on each package:
#   Organization/user: vibecook-dev
#   Repository:        mille
#   Workflow filename: release.yml
#   Allowed actions:   npm publish

on:
  # Kept as the manual escape hatch. Note that a tag pushed by release-please
  # does NOT arrive here — GITHUB_TOKEN-created tags don't trigger workflows —
  # which is why release-please.yml dispatches this workflow explicitly.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm. Off by default so a dispatch can exercise the 8-target build without touching the registry."
        type: boolean
        default: false
      dry_run:
        description: "Run `pnpm publish --dry-run` instead of publishing (implies no registry writes)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # ------------------------------------------------------------------
  # Native build matrix — 8 platform triples.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
            build: pnpm build:napi --target aarch64-apple-darwin --release

          # Cross-compile on arm64 macos-14 — macos-13 Intel is retired/scarce.
          - host: macos-14
            target: x86_64-apple-darwin
            build: pnpm build:napi --target x86_64-apple-darwin --release

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build:napi --target x86_64-pc-windows-msvc --release

          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build:napi --target aarch64-pc-windows-msvc --release

          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: pnpm build:napi --target x86_64-unknown-linux-gnu --release --use-napi-cross

          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: pnpm build:napi --target aarch64-unknown-linux-gnu --release --use-napi-cross

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target x86_64-unknown-linux-musl --release

          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target aarch64-unknown-linux-musl --release --use-napi-cross

    steps:
      - uses: actions/checkout@v4

      # Host tooling only for non-docker targets. Docker images ship their own
      # Node/Rust; skipping host pnpm cache avoids post-step path errors when
      # install never ran on the runner.
      - name: Setup pnpm
        if: ${{ !matrix.settings.docker }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        if: ${{ !matrix.settings.docker }}
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.settings.target }}

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: pnpm install --frozen-lockfile=false

      - name: Build (host)
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: ${{ matrix.settings.build }}

      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: -v ${{ github.workspace }}:/build -w /build -e CI=true
          shell: bash
          run: |
            set -euo pipefail
            export CI=true
            # Alpine images still ship Node 18; @napi-rs/cli needs styleText (Node 20+).
            major=$(node -p "process.versions.node.split('.')[0]")
            if [ "$major" -lt 20 ]; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache curl xz
                arch=$(uname -m)
                case "$arch" in
                  x86_64) node_arch=x64 ;;
                  aarch64) node_arch=arm64 ;;
                  *) echo "unsupported arch: $arch"; exit 1 ;;
                esac
                curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v20.18.1/node-v20.18.1-linux-${node_arch}-musl.tar.gz" \
                  | tar -xz -C /usr/local --strip-components=1
              else
                npm install -g n --force && n 20
                hash -r
              fi
            fi
            node -v
            npm install -g pnpm@10.33.0 --force
            pnpm config set confirmModulesPurge false
            pnpm install --frozen-lockfile=false
            ${{ matrix.settings.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            packages/**/*.node
            artifacts/**/*.node
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Collect artifacts + publish via npm Trusted Publishing (OIDC).
  # ------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node ≥ 22.14 and npm ≥ 11.5.1 required for OIDC trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: false

      # napi artifacts (cli 3.7) skips our layout ("mille" vs default "index").
      # Place binaries into packages/mille-{triple}/ by hand.
      - name: Move binaries into per-platform packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          placed=0
          for f in artifacts/bindings-*/packages/mille/mille.*.node; do
            base=$(basename "$f")
            triple=${base#mille.}
            triple=${triple%.node}
            dest="packages/mille-${triple}"
            if [[ ! -d "$dest" ]]; then
              echo "::error::missing package dir $dest for $f"
              exit 1
            fi
            cp -v "$f" "$dest/"
            placed=$((placed + 1))
          done
          echo "Placed ${placed} native binaries"
          if [[ "$placed" -ne 8 ]]; then
            echo "::error::expected 8 binaries, got ${placed}"
            find artifacts -name '*.node' -print
            exit 1
          fi
          ls -la packages/mille-*/mille.*.node

      - name: Stamp optionalDependencies versions
        run: pnpm exec napi pre-publish -t npm --no-gh-release

      # Build JS packages so dist/ ships in the tarball (dist/ is gitignored).
      - name: Build TypeScript packages
        run: |
          pnpm --filter @vibecook/mille run build:ts
          pnpm --filter @vibecook/mille-ui run build
          pnpm --filter @vibecook/mille-truffle run build

      # A tag push is an explicit act of release, so it publishes on its own.
      # A dispatch must opt in via `publish=true` (release-please.yml passes
      # it) — otherwise this workflow is a build-and-stamp rehearsal.
      - name: Decide whether to publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run requested — nothing will be published."
          elif [ "${EVENT}" = "push" ] || [ "${PUBLISH_INPUT}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch without publish=true — build only."
          fi

      # The tag and the versions in the tree must agree, or we publish one
      # version's code under another version's number. Cheap to check, and the
      # failure it prevents is unfixable after the fact: npm forbids reusing a
      # version, so a wrong publish burns that number permanently.
      - name: Verify tag matches package versions
        if: ${{ steps.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./packages/mille/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${TAG} does not match packages/mille/package.json (${PKG}). Refusing to publish."
            exit 1
          fi
          # Lock-step is the whole point: one straggler ships a version nobody
          # can install alongside the rest.
          for f in packages/mille-ui/package.json packages/mille-*/package.json; do
            node -e "
              const fs=require('fs');
              const p=JSON.parse(fs.readFileSync('$f','utf8'));
              if (p.private) process.exit(0);
              if ('v'+p.version !== '$TAG') {
                console.error('::error::$f is ' + p.version + ', expected ${TAG#v}');
                process.exit(1);
              }
            "
          done
          echo "All published packages agree on ${TAG}."

      - name: Publish (dry-run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run

      # OIDC: npm CLI detects GITHUB_ACTIONS + id-token and exchanges for a
      # short-lived publish token. No NODE_AUTH_TOKEN / NPM_TOKEN needed once
      # each package has a Trusted Publisher for release.yml.
      - name: Publish
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: pnpm -r publish --access public --no-git-checks
