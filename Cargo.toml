[workspace]
members = [
    "crates/mille-core",
    "crates/mille-binding",
    "crates/mille-bench",
]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vibecook-dev/mille"

[workspace.dependencies]
# NAPI bindings (3.x as of 2026-04)
napi = { version = "3.8", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "3.5"
napi-build = "2.3"

# Filesystem watching
notify = "6.1"
notify-debouncer-full = "0.3"

# Parallel directory walking
jwalk = "0.8"

# Gitignore matching (ripgrep's crate)
ignore = "0.4"

# Glob matching
globset = "0.4"

# Locale-aware filename collation
icu_collator = "2.2.1"
icu_locale_core = "2.2"

# Concurrent data structures
dashmap = "6.1"
arc-swap = "1.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
# bincode pinned to 2.x with explicit config (see SPEC §4.8, PLAN 13.6)
bincode = { version = "=2.0.1", features = ["serde"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Fuzzy matching
nucleo = "0.5"

# Hashing
blake3 = "1.8"

# Memory-mapped IO
memmap2 = "0.9"

# Errors
thiserror = "2.0"

# Small collections
smallvec = { version = "1.13", features = ["const_generics", "union"] }

# Bitflags (for Capability and friends)
bitflags = { version = "2", features = ["serde"] }

# Dev
proptest = "1.11"
tempfile = "3.27"

[profile.release]
lto = "fat"
codegen-units = 1
# `abort` is wrong for a library that loads into someone else's Electron main
# process: a panic becomes SIGABRT and takes the host editor down with it, with
# no catchable error and no chance to flush unsaved work. It also defeats the
# tokio runtime's own task-level panic capture, so the async entry points that
# recover cleanly in a debug build were dying in release — measured, both probes
# exiting 134. Unwinding is what lets `catch_unwind` on the napi entry points
# turn a panic into a JS exception. See `test/panic-boundary.test.mjs`.
panic = "unwind"

[profile.bench]
inherits = "release"
