# cargo-about's configuration for the platform packages' third-party notices
# (scripts/release-notices.mjs, run by release.yml's publish job).
#
# Each @vibecook/mille-<platform> package is a native addon that links a few hundred crates other
# people wrote, and their licences ask for their notices to travel with the binary. The package
# used to carry only mille's own LICENSE. This file is how the notices are generated; it is not a
# licence policy. The crates are chosen in Cargo.lock, and nothing here decides what may be linked.
# `accepted` only tells cargo-about which licence of a crate's expression to print. It is in
# priority order, so a dual-licensed crate's notice is the first one listed that satisfies it.
# A crate whose licence is not here fails the release (`--fail`) rather than shipping unlisted, and
# adding a licence to this list is a decision about the graph, made in review, never to get a red
# job green.
#
# `targets` is deliberately absent. cargo-about evaluates every listed target at once, so one list
# would give all eight packages the union of their graphs. release-notices.mjs prepends one
# target per run instead.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    # im, sized-chunks and bitmaps (through loro) and nucleo are MPL-2.0 crates, linked as
    # published and unmodified.
    "MPL-2.0",
]

# Only what is linked into the addon. A build script's dependencies run on the build machine and
# never reach the .node, and dev-dependencies are tests and benches.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# rustix and linux-raw-sys ship a COPYRIGHT file that confuses licence detection (cargo-about's
# own built-in clarification, docs/src/cli/generate/workarounds.md).
workarounds = ["rustix"]
