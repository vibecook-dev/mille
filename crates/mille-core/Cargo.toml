[package]
name = "mille-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust core for the mille file-explorer library. No NAPI."

[lib]
path = "src/lib.rs"

[dependencies]
# Filesystem walking + watching
notify.workspace = true
notify-debouncer-full.workspace = true
ignore.workspace = true
globset.workspace = true

# Locale-aware filename collation
icu_collator.workspace = true
icu_locale_core.workspace = true

# Concurrent data structures
dashmap.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true

# Async runtime
tokio.workspace = true
tokio-util.workspace = true

# Serialization
bincode.workspace = true
rmp-serde.workspace = true
serde.workspace = true

# Fuzzy matching
nucleo.workspace = true

# Hashing
blake3.workspace = true

# Memory-mapped IO
memmap2.workspace = true

# Errors
thiserror.workspace = true


# Small collections
smallvec.workspace = true

# Bitflags (Capability mask)
bitflags.workspace = true

# The Linux lister behind `walk_scan` (src/scan_list.rs): `getdents64` +
# `statx`. Already in the lock graph via tempfile.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
