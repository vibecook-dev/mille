[package]
name = "mille-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin napi-rs binding for mille-core."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Test-only entry points that deliberately panic, so the suite can assert a
# native panic surfaces as a catchable JS error instead of killing the host
# process. Never enabled for published artifacts — see `build:napi:probe`.
#
# With `git` also on, it carries `mille-git`'s probe too: a panic inside the
# git engine's own code and runtime, so the feature-gated module is not the
# one exception path the panic boundary leaves unproved (SPEC mille-git §18.4).
panic-probe = ["mille-git?/panic-probe"]
# The git engine (`GitEngine`, SPEC mille-git §18). Off by default and off in
# every published platform package until its size is measured (§32.1):
# FileTree-only embedders must not link gix. `build:napi:git*` turn it on.
git = ["dep:mille-git", "dep:serde_json"]

[dependencies]
mille-core = { path = "../mille-core" }
mille-git = { path = "../mille-git", optional = true }
# Git results cross napi as JSON text (see `src/git.rs`); FileTree never does.
serde_json = { version = "1", optional = true }
bincode.workspace = true
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Windows has no stable file id on `std::fs::Metadata` (the accessors are
# behind the unstable `windows_by_handle` feature), so undo identity asks the
# kernel through an open handle instead. See `file_id_from_handle`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
napi-build.workspace = true
